<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Sedang Ditonton</title>
<style>
:root {
  --ink: #0e0f11;
  --paper: #f6f5f1;
  --accent: #2d6cdf;
  --danger: #d64545;
  --line: rgba(14, 15, 17, 0.1);
  --card-bg: #ffffff;
  --bg: #f1f1f3;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.hidden {
  display: none !important;
}

/* ---------- Login ---------- */

#login-screen {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#login-box {
  width: 100%;
  max-width: 320px;
  background: var(--card-bg);
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
  text-align: center;
}

#login-box h1 {
  margin: 0 0 8px;
  font-size: 20px;
}

#login-box p {
  margin: 0 0 18px;
  font-size: 13px;
  color: rgba(14, 15, 17, 0.65);
}

#password-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 15px;
  margin-bottom: 12px;
}

#login-btn {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: var(--paper);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

#login-error {
  margin-top: 12px;
  font-size: 13px;
  color: var(--danger);
}

/* ---------- Dashboard ---------- */

#topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--ink);
  color: var(--paper);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#topbar span {
  font-weight: 700;
  font-size: 16px;
}

#logout-btn {
  background: none;
  border: 1px solid rgba(246, 245, 241, 0.35);
  color: var(--paper);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
}

#sessions-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 14px 60px;
}

#empty-state {
  padding: 60px 20px;
  text-align: center;
  color: rgba(14, 15, 17, 0.6);
}

#sessions-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#sessions-list li {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.session-thumb {
  flex-shrink: 0;
  border-radius: 8px;
  background: #000;
  display: block;
  /* Ukuran sebenarnya (width/height) diset lewat JS begitu dimensi asli
     videonya diketahui (loadedmetadata), supaya rasio aspek preview persis
     sama seperti video aslinya -- baik itu vertikal (potret) atau
     horizontal (lanskap). Ini cuma nilai default sebelum itu terjadi. */
  width: 120px;
  height: 120px;
}

.session-body {
  flex: 1;
  min-width: 0;
}

.session-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}

.session-video-name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-updated {
  font-size: 11px;
  color: rgba(14, 15, 17, 0.5);
  flex-shrink: 0;
}

.session-progress-track {
  position: relative;
  height: 6px;
  border-radius: 3px;
  background: rgba(14, 15, 17, 0.1);
  overflow: hidden;
  margin-bottom: 6px;
}

.session-progress-fill {
  position: absolute;
  inset: 0;
  width: 0%;
  background: var(--accent);
}

.session-time {
  font-size: 12px;
  color: rgba(14, 15, 17, 0.6);
  font-variant-numeric: tabular-nums;
}

.session-viewer {
  margin-top: 6px;
  font-size: 11px;
  color: rgba(14, 15, 17, 0.55);
  display: flex;
  align-items: center;
  gap: 6px;
}

.session-viewer .ip {
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.session-viewer .dot {
  opacity: 0.4;
}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Admin</h1>
    <p>Masukkan password untuk melihat siapa sedang menonton.</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="off" />
    <button id="login-btn">Masuk</button>
    <p id="login-error" class="hidden"></p>
  </div>
</div>

<div id="dashboard" class="hidden">
  <header id="topbar">
    <span>Sedang Ditonton</span>
    <button id="logout-btn">Keluar</button>
  </header>

  <main id="sessions-wrap">
    <div id="empty-state" class="hidden">
      <p>Belum ada yang menonton saat ini.</p>
    </div>
    <ul id="sessions-list"></ul>
  </main>
</div>

<script src="config.js"></script>
<script>
const loginScreen = document.getElementById("login-screen");
const dashboard = document.getElementById("dashboard");
const passwordInput = document.getElementById("password-input");
const loginBtn = document.getElementById("login-btn");
const loginError = document.getElementById("login-error");
const logoutBtn = document.getElementById("logout-btn");
const sessionsList = document.getElementById("sessions-list");
const emptyState = document.getElementById("empty-state");

const PASSWORD_STORAGE_KEY = "admin:password";
let pollTimer = null;

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function videoSrc(fileId) {
  // Sama seperti di app.js: langsung ke Google Drive, bukan lewat proxy,
  // supaya Range request (seek) ditangani server Google.
  return `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(GOOGLE_DRIVE_API_KEY)}`;
}

// Hitung ukuran kotak preview supaya PAS mengikuti rasio aspek asli video
// (bukan dipaksa 16:9) -- video potret (vertikal, umum di FeedTok) jadi
// kotak tinggi & sempit, video lanskap jadi kotak lebar & pendek. Tetap
// dibatasi biar tidak ada yang kebesaran/mengganggu layout daftar.
const THUMB_MAX_WIDTH = 150;
const THUMB_MAX_HEIGHT = 220;
function fitThumbSize(naturalWidth, naturalHeight) {
  if (!naturalWidth || !naturalHeight) return null;
  const ratio = naturalWidth / naturalHeight;
  let w = THUMB_MAX_WIDTH;
  let h = w / ratio;
  if (h > THUMB_MAX_HEIGHT) {
    h = THUMB_MAX_HEIGHT;
    w = h * ratio;
  }
  return { width: Math.round(w), height: Math.round(h) };
}

function applyNaturalSize(video) {
  const size = fitThumbSize(video.videoWidth, video.videoHeight);
  if (size) {
    video.style.width = `${size.width}px`;
    video.style.height = `${size.height}px`;
  }
}

function timeAgo(isoString) {
  const seconds = Math.max(0, Math.round((Date.now() - new Date(isoString).getTime()) / 1000));
  if (seconds < 2) return "baru saja";
  return `${seconds} detik lalu`;
}

async function fetchSessions(password) {
  const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/admin-sessions`, {
    headers: { "x-admin-password": password },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data?.error || `HTTP ${res.status}`);
  }
  return data.sessions || [];
}

// Map session_id -> elemen DOM yang sudah dibuat, supaya video preview yang
// sedang autoplay TIDAK di-reset (dan tidak "loncat"/restart) tiap kali poll
// setiap 2.5 detik -- cuma teksnya (progress, waktu, timestamp) yang di-update.
const sessionElements = new Map();

function buildSessionCard(s) {
  const li = document.createElement("li");

  const video = document.createElement("video");
  video.className = "session-thumb";
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.controls = true;
  video.preload = "metadata";
  if (s.thumbnail_url) video.poster = s.thumbnail_url;
  video.src = videoSrc(s.video_id);
  // Begitu durasi & dimensi videonya diketahui: loncat ke posisi tonton
  // viewer saat ini, dan sesuaikan ukuran kotak preview dengan rasio aspek
  // asli videonya (bisa potret atau lanskap).
  video.addEventListener("loadedmetadata", () => {
    try {
      video.currentTime = Number(s.current_time_sec) || 0;
    } catch {}
    applyNaturalSize(video);
  }, { once: true });
  video.play().catch(() => {
    // Browser mungkin tetap menahan autoplay; admin tinggal tap play manual.
  });

  const body = document.createElement("div");
  body.className = "session-body";

  const header = document.createElement("div");
  header.className = "session-header";
  const name = document.createElement("span");
  name.className = "session-video-name";
  const updated = document.createElement("span");
  updated.className = "session-updated";
  header.append(name, updated);

  const track = document.createElement("div");
  track.className = "session-progress-track";
  const fill = document.createElement("div");
  fill.className = "session-progress-fill";
  track.appendChild(fill);

  const time = document.createElement("div");
  time.className = "session-time";

  const viewer = document.createElement("div");
  viewer.className = "session-viewer";
  const ip = document.createElement("span");
  ip.className = "ip";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.textContent = "•";
  const device = document.createElement("span");
  viewer.append(ip, dot, device);

  body.append(header, track, time, viewer);
  li.append(video, body);

  return { li, video, videoId: s.video_id, name, updated, fill, time, ip, device };
}

function updateSessionCard(entry, s) {
  entry.name.textContent = s.video_name;
  entry.updated.textContent = timeAgo(s.updated_at);
  const pct = s.duration_sec ? Math.min(100, (s.current_time_sec / s.duration_sec) * 100) : 0;
  entry.fill.style.width = `${pct}%`;
  entry.time.textContent = `${formatTime(s.current_time_sec)} / ${formatTime(s.duration_sec)}`;
  entry.ip.textContent = s.ip_address || "IP tidak diketahui";
  entry.device.textContent = [s.device_type, s.os, s.browser].filter(Boolean).join(" · ") || "Device tidak diketahui";

  // Kalau viewer ganti video, baru ganti src (dan seek ulang). Kalau videonya
  // masih sama, JANGAN sentuh video.src sama sekali -- itu yang bikin
  // playback restart tiap poll sebelumnya.
  if (entry.videoId !== s.video_id) {
    entry.videoId = s.video_id;
    if (s.thumbnail_url) entry.video.poster = s.thumbnail_url;
    entry.video.src = videoSrc(s.video_id);
    entry.video.addEventListener("loadedmetadata", () => {
      try {
        entry.video.currentTime = Number(s.current_time_sec) || 0;
      } catch {}
      applyNaturalSize(entry.video);
    }, { once: true });
    entry.video.play().catch(() => {});
  }
}

function renderSessions(sessions) {
  emptyState.classList.toggle("hidden", sessions.length > 0);

  const seen = new Set();
  sessions.forEach((s) => {
    seen.add(s.session_id);
    let entry = sessionElements.get(s.session_id);
    if (!entry) {
      entry = buildSessionCard(s);
      sessionElements.set(s.session_id, entry);
    }
    updateSessionCard(entry, s);
    // appendChild pada node yang sudah ada di DOM cuma memindah posisinya
    // (tidak membuat ulang elemen), jadi video yang sedang main tidak keputus.
    sessionsList.appendChild(entry.li);
  });

  // Viewer yang sudah berhenti nonton (heartbeat-nya berhenti) -> lepas dari DOM.
  for (const [sessionId, entry] of sessionElements) {
    if (!seen.has(sessionId)) {
      entry.video.pause();
      entry.video.removeAttribute("src");
      entry.video.load();
      entry.li.remove();
      sessionElements.delete(sessionId);
    }
  }
}

function stopPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

function schedulePoll(password) {
  stopPolling();
  pollTimer = setTimeout(() => poll(password), 2500);
}

async function poll(password) {
  try {
    const sessions = await fetchSessions(password);
    renderSessions(sessions);
    schedulePoll(password);
  } catch (err) {
    // Password ternyata salah/expired di tengah jalan -> kembali ke login.
    sessionStorage.removeItem(PASSWORD_STORAGE_KEY);
    showLogin(err.message);
  }
}

function showDashboard(password) {
  loginScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");
  poll(password);
}

function showLogin(errorMessage) {
  stopPolling();
  // Hentikan semua video preview yang sedang autoplay supaya tidak terus
  // jalan di background dan makan bandwidth setelah admin keluar.
  for (const entry of sessionElements.values()) {
    entry.video.pause();
    entry.video.removeAttribute("src");
    entry.video.load();
  }
  sessionElements.clear();
  sessionsList.innerHTML = "";
  dashboard.classList.add("hidden");
  loginScreen.classList.remove("hidden");
  passwordInput.value = "";
  passwordInput.focus();
  if (errorMessage) {
    loginError.textContent = errorMessage;
    loginError.classList.remove("hidden");
  } else {
    loginError.classList.add("hidden");
  }
}

async function attemptLogin(password) {
  loginError.classList.add("hidden");
  loginBtn.disabled = true;
  loginBtn.textContent = "Memeriksa…";
  try {
    await fetchSessions(password); // dipakai sekaligus sebagai validasi password
    sessionStorage.setItem(PASSWORD_STORAGE_KEY, password);
    showDashboard(password);
  } catch (err) {
    loginError.textContent = err.message || "Password salah.";
    loginError.classList.remove("hidden");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Masuk";
  }
}

loginBtn.addEventListener("click", () => {
  const password = passwordInput.value.trim();
  if (!password) return;
  attemptLogin(password);
});

passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

logoutBtn.addEventListener("click", () => {
  sessionStorage.removeItem(PASSWORD_STORAGE_KEY);
  showLogin();
});

// Kalau tab ini masih ingat password dari sesi sebelumnya, coba langsung
// masuk tanpa minta ketik ulang.
const savedPassword = sessionStorage.getItem(PASSWORD_STORAGE_KEY);
if (savedPassword) {
  attemptLogin(savedPassword);
}
</script>
</body>
</html>
