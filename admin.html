<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Sedang Ditonton</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #0b0c0f;
  --surface: #121317;
  --card: #16181d;
  --card-hover: #1b1e24;
  --ink: #eef0f2;
  --muted: rgba(238, 240, 242, 0.52);
  --muted-strong: rgba(238, 240, 242, 0.72);
  --line: rgba(238, 240, 242, 0.08);
  --accent: #dc1f39;
  --accent-bright: #ff4757;
  --accent-wash: rgba(220, 31, 57, 0.14);
  --online: #35c07a;
  --online-wash: rgba(53, 192, 122, 0.14);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.hidden {
  display: none !important;
}

/* ---------- Login ---------- */

#login-screen {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 0%, rgba(220, 31, 57, 0.08), transparent 55%),
    var(--bg);
}

#login-box {
  width: 100%;
  max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px 26px;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
  text-align: center;
}

#login-box h1 {
  margin: 0 0 8px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

#login-box p {
  margin: 0 0 20px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

#password-input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  margin-bottom: 12px;
  transition: border-color 0.15s ease;
}

#password-input:focus {
  outline: none;
  border-color: var(--accent);
}

#password-input::placeholder {
  color: var(--muted);
}

#login-btn {
  width: 100%;
  padding: 11px 12px;
  border-radius: 9px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease;
}

#login-btn:hover {
  background: var(--accent-bright);
}

#login-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

#login-error {
  margin-top: 14px;
  font-size: 13px;
  color: var(--accent-bright);
}

/* ---------- Dashboard ---------- */

#topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--surface);
  color: var(--ink);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

#topbar span {
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.01em;
}

#topbar span::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-wash);
  flex-shrink: 0;
}

#logout-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted-strong);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

#logout-btn:hover {
  border-color: var(--accent);
  color: var(--ink);
}

#sessions-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 4px 14px 60px;
}

#empty-state {
  padding: 70px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
}

#sessions-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#sessions-list li {
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
}

#sessions-list li::before {
  content: "LIVE";
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 1;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  background: var(--accent);
  padding: 3px 7px;
  border-radius: 4px;
  pointer-events: none;
}

.session-thumb {
  width: 100%;
  border-radius: 8px;
  background: #000;
  display: block;
  /* Tinggi sebenarnya diset lewat JS begitu dimensi asli videonya diketahui
     (loadedmetadata), supaya video tampil selebar kartu dengan tinggi yang
     mengikuti rasio aspek asli -- baik itu potret maupun lanskap. Ini cuma
     nilai default sebelum itu terjadi. */
  aspect-ratio: 16 / 9;
  max-height: 70vh;
  object-fit: contain;
}

.session-body {
  min-width: 0;
  padding: 0 4px;
}

.session-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 9px;
}

.session-video-name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink);
}

.session-updated {
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
}

.session-progress-track {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
  margin-bottom: 7px;
}

.session-progress-fill {
  position: absolute;
  inset: 0;
  width: 0%;
  background: var(--accent);
}

.session-time {
  font-size: 12px;
  color: var(--muted-strong);
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
}

.session-viewer {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--muted-strong);
  display: flex;
  align-items: center;
  gap: 6px;
}

.session-viewer .ip {
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  color: var(--ink);
}

.session-viewer .dot {
  opacity: 0.4;
}

/* ---------- Tabs ---------- */

#tabs {
  display: flex;
  gap: 4px;
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 14px;
  background: var(--bg);
  position: sticky;
  top: 61px;
  z-index: 4;
}

.tab-btn {
  flex: 1;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted-strong);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.tab-btn:hover {
  color: var(--ink);
}

.tab-btn.active {
  background: var(--card);
  color: var(--ink);
  border-color: var(--line);
}

/* ---------- Riwayat ---------- */

#history-toolbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
}

#clear-history-btn {
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent-bright);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease;
}

#clear-history-btn:hover {
  background: var(--accent-wash);
}

#clear-history-btn:disabled {
  opacity: 0.5;
  cursor: default;
  background: transparent;
}

#history-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#history-list li {
  background: var(--card);
  border-radius: 10px;
  padding: 13px 14px;
  border: 1px solid var(--line);
}

.history-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.history-ip {
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  color: var(--ink);
}

.history-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.history-badge.online {
  background: var(--online-wash);
  color: var(--online);
}

.history-badge.offline {
  background: rgba(238, 240, 242, 0.06);
  color: var(--muted);
}

.history-device {
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 8px;
}

.history-times {
  display: flex;
  gap: 20px;
  font-size: 12px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.history-times div span {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 3px;
}

.history-times div {
  font-family: var(--mono);
  color: var(--muted-strong);
}

/* ---------- Accessibility ---------- */

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent-bright);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Admin</h1>
    <p>Masukkan password untuk melihat siapa sedang menonton.</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="off" />
    <button id="login-btn">Masuk</button>
    <p id="login-error" class="hidden"></p>
  </div>
</div>

<div id="dashboard" class="hidden">
  <header id="topbar">
    <span>Sedang Ditonton</span>
    <button id="logout-btn">Keluar</button>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" id="tab-live" type="button">Sedang Ditonton</button>
    <button class="tab-btn" id="tab-history" type="button">Riwayat Masuk/Keluar</button>
  </nav>

  <main id="sessions-wrap">
    <div id="live-view">
      <div id="empty-state" class="hidden">
        <p>Belum ada yang menonton saat ini.</p>
      </div>
      <ul id="sessions-list"></ul>
    </div>

    <div id="history-view" class="hidden">
      <div id="history-toolbar">
        <button id="clear-history-btn" type="button">Bersihkan Semua</button>
      </div>
      <div id="history-empty" class="hidden">
        <p>Belum ada riwayat kunjungan.</p>
      </div>
      <ul id="history-list"></ul>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
const loginScreen = document.getElementById("login-screen");
const dashboard = document.getElementById("dashboard");
const passwordInput = document.getElementById("password-input");
const loginBtn = document.getElementById("login-btn");
const loginError = document.getElementById("login-error");
const logoutBtn = document.getElementById("logout-btn");
const sessionsList = document.getElementById("sessions-list");
const emptyState = document.getElementById("empty-state");
const tabLive = document.getElementById("tab-live");
const tabHistory = document.getElementById("tab-history");
const liveView = document.getElementById("live-view");
const historyView = document.getElementById("history-view");
const historyList = document.getElementById("history-list");
const historyEmpty = document.getElementById("history-empty");

const clearHistoryBtn = document.getElementById("clear-history-btn");

const PASSWORD_STORAGE_KEY = "admin:password";
let pollTimer = null;
let lastHistory = [];
let currentPassword = null;

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function videoSrc(fileId) {
  // Sama seperti di app.js: langsung ke Google Drive, bukan lewat proxy,
  // supaya Range request (seek) ditangani server Google.
  return `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(GOOGLE_DRIVE_API_KEY)}`;
}

// Video preview sekarang selebar kartu (100%, lihat CSS .session-thumb).
// Yang perlu diset lewat JS cuma rasio aspeknya begitu dimensi asli
// videonya diketahui (loadedmetadata) -- video potret (vertikal, umum di
// FeedTok) jadi tinggi, video lanskap jadi pendek, otomatis mengikuti
// bentuk aslinya. max-height 70vh di CSS mencegah video potret jadi
// kepanjangan di layar admin.
function applyNaturalSize(video) {
  if (video.videoWidth && video.videoHeight) {
    video.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  }
}

function timeAgo(isoString) {
  const seconds = Math.max(0, Math.round((Date.now() - new Date(isoString).getTime()) / 1000));
  if (seconds < 2) return "baru saja";
  return `${seconds} detik lalu`;
}

async function fetchSessions(password) {
  const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/admin-sessions`, {
    headers: { "x-admin-password": password },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data?.error || `HTTP ${res.status}`);
  }
  return { sessions: data.sessions || [], history: data.history || [] };
}

function formatDateTime(isoString) {
  if (!isoString) return "-";
  return new Date(isoString).toLocaleString("id-ID", {
    day: "2-digit",
    month: "2-digit",
    year: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
  });
}

function buildHistoryItem(h) {
  const li = document.createElement("li");

  const top = document.createElement("div");
  top.className = "history-top";
  const ip = document.createElement("span");
  ip.className = "history-ip";
  ip.textContent = h.ip_address || "IP tidak diketahui";
  const badge = document.createElement("span");
  badge.className = `history-badge ${h.still_online ? "online" : "offline"}`;
  badge.textContent = h.still_online ? "Online" : "Offline";
  top.append(ip, badge);

  const device = document.createElement("div");
  device.className = "history-device";
  device.textContent = [h.device_type, h.os, h.browser].filter(Boolean).join(" · ") || "Device tidak diketahui";

  const times = document.createElement("div");
  times.className = "history-times";

  const masuk = document.createElement("div");
  masuk.innerHTML = `<span>Masuk</span>${formatDateTime(h.created_at)}`;

  const keluar = document.createElement("div");
  keluar.innerHTML = `<span>Keluar</span>${h.still_online ? "Masih di web" : formatDateTime(h.left_at || h.last_seen_at)}`;

  times.append(masuk, keluar);
  li.append(top, device, times);
  return li;
}

function renderHistory(history) {
  historyEmpty.classList.toggle("hidden", history.length > 0);
  historyList.innerHTML = "";
  const fragment = document.createDocumentFragment();
  history.forEach((h) => fragment.appendChild(buildHistoryItem(h)));
  historyList.appendChild(fragment);
}

function setActiveTab(tab) {
  const isLive = tab === "live";
  tabLive.classList.toggle("active", isLive);
  tabHistory.classList.toggle("active", !isLive);
  liveView.classList.toggle("hidden", !isLive);
  historyView.classList.toggle("hidden", isLive);
  if (!isLive) renderHistory(lastHistory);
}

tabLive.addEventListener("click", () => setActiveTab("live"));
tabHistory.addEventListener("click", () => setActiveTab("history"));

// Map session_id -> elemen DOM yang sudah dibuat, supaya video preview yang
// sedang autoplay TIDAK di-reset (dan tidak "loncat"/restart) tiap kali poll
// setiap 2.5 detik -- cuma teksnya (progress, waktu, timestamp) yang di-update.
const sessionElements = new Map();

function buildSessionCard(s) {
  const li = document.createElement("li");

  const video = document.createElement("video");
  video.className = "session-thumb";
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  // Video preview ini murni tampilan realtime -- admin tidak perlu (dan
  // tidak boleh) bisa play/pause/seek/volume/fullscreen dari sini, karena
  // posisinya sepenuhnya mengikuti viewer asli lewat resync otomatis di
  // updateSessionCard(). Kontrol bawaan browser dimatikan total.
  video.controls = false;
  video.disablePictureInPicture = true;
  video.setAttribute("controlsList", "nodownload noplaybackrate noremoteplayback");
  video.style.pointerEvents = "none";
  video.preload = "metadata";
  if (s.thumbnail_url) video.poster = s.thumbnail_url;
  video.src = videoSrc(s.video_id);
  // Begitu durasi & dimensi videonya diketahui: loncat ke posisi tonton
  // viewer saat ini, dan sesuaikan ukuran kotak preview dengan rasio aspek
  // asli videonya (bisa potret atau lanskap).
  video.addEventListener("loadedmetadata", () => {
    try {
      video.currentTime = Number(s.current_time_sec) || 0;
    } catch {}
    applyNaturalSize(video);
  }, { once: true });
  video.play().catch(() => {
    // Browser mungkin tetap menahan autoplay; admin tinggal tap play manual.
  });

  const body = document.createElement("div");
  body.className = "session-body";

  const header = document.createElement("div");
  header.className = "session-header";
  const name = document.createElement("span");
  name.className = "session-video-name";
  const updated = document.createElement("span");
  updated.className = "session-updated";
  header.append(name, updated);

  const track = document.createElement("div");
  track.className = "session-progress-track";
  const fill = document.createElement("div");
  fill.className = "session-progress-fill";
  track.appendChild(fill);

  const time = document.createElement("div");
  time.className = "session-time";

  const viewer = document.createElement("div");
  viewer.className = "session-viewer";
  const ip = document.createElement("span");
  ip.className = "ip";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.textContent = "•";
  const device = document.createElement("span");
  viewer.append(ip, dot, device);

  body.append(header, track, time, viewer);
  li.append(video, body);

  return { li, video, videoId: s.video_id, name, updated, fill, time, ip, device, prevCurrentTimeSec: null, stalledSinceAt: null };
}

// Kalau selisih posisi preview vs posisi asli viewer melebihi ini (detik),
// preview dianggap "meleset" (viewer maju/mundurin videonya) dan di-seek
// ulang supaya sinkron lagi. Jangan set terlalu kecil, karena drift wajar
// dari jeda polling (2.5 detik) + buffering juga bisa sebesar ini.
const RESYNC_THRESHOLD_SEC = 3;

function updateSessionCard(entry, s) {
  entry.name.textContent = s.video_name;
  const pct = s.duration_sec ? Math.min(100, (s.current_time_sec / s.duration_sec) * 100) : 0;
  entry.fill.style.width = `${pct}%`;
  entry.time.textContent = `${formatTime(s.current_time_sec)} / ${formatTime(s.duration_sec)}`;
  entry.ip.textContent = s.ip_address || "IP tidak diketahui";
  entry.device.textContent = [s.device_type, s.os, s.browser].filter(Boolean).join(" · ") || "Device tidak diketahui";

  // Kalau viewer ganti video, baru ganti src (dan seek ulang). Kalau videonya
  // masih sama, JANGAN sentuh video.src sama sekali -- itu yang bikin
  // playback restart tiap poll sebelumnya.
  if (entry.videoId !== s.video_id) {
    entry.videoId = s.video_id;
    entry.prevCurrentTimeSec = null;
    entry.stalledSinceAt = null;
    entry.updated.textContent = timeAgo(s.updated_at);
    if (s.thumbnail_url) entry.video.poster = s.thumbnail_url;
    entry.video.src = videoSrc(s.video_id);
    entry.video.addEventListener("loadedmetadata", () => {
      try {
        entry.video.currentTime = Number(s.current_time_sec) || 0;
      } catch {}
      applyNaturalSize(entry.video);
    }, { once: true });
    entry.video.play().catch(() => {});
    return;
  }

  // Deteksi viewer sedang pause: posisi tonton dari server (current_time_sec)
  // berhenti maju. Heartbeat pengguna cuma update tiap 4 detik sementara
  // admin polling tiap 2 detik, jadi satu kali "belum berubah" itu WAJAR
  // (kebetulan heartbeat berikutnya belum sampai) -- bukan berarti pause.
  // Baru dianggap pause kalau posisinya diam lebih lama dari satu siklus
  // heartbeat (>6 detik), supaya tidak salah kedip nge-label "Dijeda" pada
  // video yang sebenarnya masih jalan normal.
  const PAUSE_STALL_THRESHOLD_MS = 6000;
  const target = Number(s.current_time_sec) || 0;

  if (entry.prevCurrentTimeSec === null || Math.abs(target - entry.prevCurrentTimeSec) >= 0.3) {
    entry.prevCurrentTimeSec = target;
    entry.stalledSinceAt = Date.now();
  }

  const viewerPaused = Date.now() - entry.stalledSinceAt >= PAUSE_STALL_THRESHOLD_MS;

  entry.updated.textContent = timeAgo(s.updated_at) + (viewerPaused ? " · Dijeda" : "");

  if (viewerPaused) {
    if (!entry.video.paused) entry.video.pause();
    if (entry.video.readyState > 0 && Math.abs(entry.video.currentTime - target) > 0.5) {
      try {
        entry.video.currentTime = target;
      } catch {}
    }
    return;
  }

  if (entry.video.paused) entry.video.play().catch(() => {});

  // Video sama seperti sebelumnya -- cek apakah viewer maju/mundurin
  // videonya (seek). Kalau selisihnya jauh, susul posisi preview ke sana.
  // readyState > 0 berarti metadata (termasuk currentTime) sudah bisa dibaca.
  if (entry.video.readyState > 0) {
    const drift = Math.abs(entry.video.currentTime - target);
    if (drift > RESYNC_THRESHOLD_SEC) {
      try {
        entry.video.currentTime = target;
      } catch {}
    }
  }
}

function renderSessions(sessions) {
  emptyState.classList.toggle("hidden", sessions.length > 0);

  const seen = new Set();
  sessions.forEach((s) => {
    seen.add(s.session_id);
    let entry = sessionElements.get(s.session_id);
    if (!entry) {
      entry = buildSessionCard(s);
      sessionElements.set(s.session_id, entry);
    }
    updateSessionCard(entry, s);
    // appendChild pada node yang sudah ada di DOM cuma memindah posisinya
    // (tidak membuat ulang elemen), jadi video yang sedang main tidak keputus.
    sessionsList.appendChild(entry.li);
  });

  // Viewer yang sudah berhenti nonton (heartbeat-nya berhenti) -> lepas dari DOM.
  for (const [sessionId, entry] of sessionElements) {
    if (!seen.has(sessionId)) {
      entry.video.pause();
      entry.video.removeAttribute("src");
      entry.video.load();
      entry.li.remove();
      sessionElements.delete(sessionId);
    }
  }
}

function stopPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

function schedulePoll(password) {
  stopPolling();
  pollTimer = setTimeout(() => poll(password), 2000);
}

async function poll(password) {
  currentPassword = password;
  try {
    const { sessions, history } = await fetchSessions(password);
    renderSessions(sessions);
    lastHistory = history;
    if (!historyView.classList.contains("hidden")) renderHistory(history);
    schedulePoll(password);
  } catch (err) {
    // Password ternyata salah/expired di tengah jalan -> kembali ke login.
    sessionStorage.removeItem(PASSWORD_STORAGE_KEY);
    showLogin(err.message);
  }
}

async function clearHistory() {
  if (!currentPassword) return;
  const confirmed = confirm(
    "Hapus semua riwayat kunjungan kecuali yang masih di web sekarang? Tindakan ini tidak bisa dibatalkan."
  );
  if (!confirmed) return;

  clearHistoryBtn.disabled = true;
  clearHistoryBtn.textContent = "Membersihkan…";
  try {
    const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/admin-clear-history`, {
      method: "POST",
      headers: { "x-admin-password": currentPassword },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
    // Langsung refresh riwayat di layar tanpa menunggu poll berikutnya.
    const { history } = await fetchSessions(currentPassword);
    lastHistory = history;
    renderHistory(history);
  } catch (err) {
    alert(`Gagal membersihkan riwayat: ${err.message}`);
  } finally {
    clearHistoryBtn.disabled = false;
    clearHistoryBtn.textContent = "Bersihkan Semua";
  }
}

clearHistoryBtn.addEventListener("click", clearHistory);

function showDashboard(password) {
  loginScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");
  poll(password);
}

function showLogin(errorMessage) {
  stopPolling();
  currentPassword = null;
  // Hentikan semua video preview yang sedang autoplay supaya tidak terus
  // jalan di background dan makan bandwidth setelah admin keluar.
  for (const entry of sessionElements.values()) {
    entry.video.pause();
    entry.video.removeAttribute("src");
    entry.video.load();
  }
  sessionElements.clear();
  sessionsList.innerHTML = "";
  dashboard.classList.add("hidden");
  loginScreen.classList.remove("hidden");
  passwordInput.value = "";
  passwordInput.focus();
  if (errorMessage) {
    loginError.textContent = errorMessage;
    loginError.classList.remove("hidden");
  } else {
    loginError.classList.add("hidden");
  }
}

async function attemptLogin(password) {
  loginError.classList.add("hidden");
  loginBtn.disabled = true;
  loginBtn.textContent = "Memeriksa…";
  try {
    await fetchSessions(password); // dipakai sekaligus sebagai validasi password
    sessionStorage.setItem(PASSWORD_STORAGE_KEY, password);
    showDashboard(password);
  } catch (err) {
    loginError.textContent = err.message || "Password salah.";
    loginError.classList.remove("hidden");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Masuk";
  }
}

loginBtn.addEventListener("click", () => {
  const password = passwordInput.value.trim();
  if (!password) return;
  attemptLogin(password);
});

passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

logoutBtn.addEventListener("click", () => {
  sessionStorage.removeItem(PASSWORD_STORAGE_KEY);
  showLogin();
});

// Kalau tab ini masih ingat password dari sesi sebelumnya, coba langsung
// masuk tanpa minta ketik ulang.
const savedPassword = sessionStorage.getItem(PASSWORD_STORAGE_KEY);
if (savedPassword) {
  attemptLogin(savedPassword);
}
</script>
